[tool.poetry]
name = "mySharesDefinition"
version = "1.0.0"
description = "A Python package that holds definitions for SQLite tables."
authors = ["oliverrudow <oliver.rudow@googlemail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.14"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"